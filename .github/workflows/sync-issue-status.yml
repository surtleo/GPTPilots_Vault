name: Sync Issue Status

on:
  schedule:
    - cron: '0 */3 * * *'   # 3시간마다
  issues:
    types: [opened, closed, reopened, assigned, milestoned]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      # GH_PAT 시크릿이 없으면 조용히 스킵 (실패 메일 방지) — 설정 방법은 README 참고
      - name: Check GH_PAT secret
        id: guard
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GH_PAT 시크릿이 없어 이슈 동기화를 건너뜁니다. README의 'GitHub Actions 시크릿 설정'을 참고하세요."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Sync issue status from GitHub Projects
        if: steps.guard.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python .github/scripts/sync_issue_status.py

      - name: Commit if changed
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "변경 없음" || (
            git add tasks/
            git commit -m "chore: sync issue status from GitHub Projects"
            git pull --rebase
            git push
          )
