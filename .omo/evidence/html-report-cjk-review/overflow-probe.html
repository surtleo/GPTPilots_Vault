const frame=document.getElementById('report');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument, vw=d.documentElement.clientWidth;
  const over=[...d.querySelectorAll('*')].map(el=>{const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return {tag:el.tagName,cls:String(el.className||''),text:(el.innerText||'').trim().slice(0,90),left:r.left,right:r.right,width:r.width,scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,overflowX:cs.overflowX}}).filter(x=>x.right>vw+0.5||x.left<-.5||x.scrollWidth>x.clientWidth+0.5);
  document.body.textContent=JSON.stringify({viewport:{innerWidth:d.defaultView.innerWidth,clientWidth:vw},doc:{scrollWidth:d.documentElement.scrollWidth,bodyScrollWidth:d.body.scrollWidth,bodyClientWidth:d.body.clientWidth},over},null,2);
});
</script>
